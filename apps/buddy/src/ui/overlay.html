<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("fonts/schibsted-grotesk-var.woff2") format("woff2"); font-weight: 400 900; }
  :root { --buddy: #2f7aff; --glow: rgba(47, 122, 255, 0.35); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Schibsted Grotesk", "Segoe UI", sans-serif; }
  #buddy { position: absolute; left: 0; top: 0; width: 22px; height: 22px; will-change: transform; opacity: 0; transition: opacity .25s; }
  #buddy svg { filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  #ring { position: absolute; border: 2px solid var(--buddy); border-radius: 8px; box-shadow: 0 0 0 4px var(--glow); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #ring.on { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(47, 122, 255, 0.12); } }
  #caption { position: absolute; max-width: 260px; padding: 7px 11px; border-radius: 12px; background: var(--buddy); color: #fff; font-size: 13.5px; line-height: 1.3; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
  #caption.on { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #ring.on { animation: none; } }
  body.hide-buddy #buddy { visibility: hidden; }

  /* Marker: translucent highlighter strokes, each numbered at its start. */
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #ink .stroke { fill: none; stroke: rgba(47, 122, 255, 0.36); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
  #ink .disc { fill: #1f5fd6; stroke: #fff; stroke-width: 2; }
  #ink .n { fill: #fff; font: 700 13px "Schibsted Grotesk", "Segoe UI", sans-serif; text-anchor: middle; }
</style>
</head>
<body>
<div id="ring"></div>
<div id="buddy">
  <svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2 L19 10 L11.5 12 L8.5 19.5 Z" fill="#2f7aff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<div id="caption"></div>
<svg id="ink" aria-hidden="true"></svg>
<script>
  // ---------- Marks: what the user highlighted stays on screen while they ask about it ----------
  // (Drawing happens in marker.html; this only shows the finished strokes.)
  const SVG = "http://www.w3.org/2000/svg";
  const ink = document.getElementById("ink");

  const el = (name, attrs) => {
    const node = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  };
  // Same curve smoothing as marker.html, so the marks look identical after the still closes.
  function pathOf(pts) {
    if (pts.length === 1) return `M${pts[0].x} ${pts[0].y} l0.01 0`;
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      d += ` Q${pts[i].x} ${pts[i].y} ${(pts[i].x + pts[i + 1].x) / 2} ${(pts[i].y + pts[i + 1].y) / 2}`;
    }
    return d + ` L${pts.at(-1).x} ${pts.at(-1).y}`;
  }

  function drawStroke(points, n) {
    ink.appendChild(el("path", { d: pathOf(points), class: "stroke" }));
    const { x, y } = points[0];
    ink.appendChild(el("circle", { cx: x - 14, cy: y - 14, r: 11, class: "disc" }));
    const t = el("text", { x: x - 14, y: y - 9.5, class: "n" });
    t.textContent = n;
    ink.appendChild(t);
  }

  window.buddy.onMarksClear(() => ink.replaceChildren());
  window.buddy.onMarkDrawn(({ points, n }) => drawStroke(points, n));
</script>
<script>
  window.buddy.onHideBuddy((hidden) => document.body.classList.toggle("hide-buddy", hidden));
  const buddyEl = document.getElementById("buddy");
  const ring = document.getElementById("ring");
  const caption = document.getElementById("caption");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const pos = { x: -100, y: -100 };
  let mode = "follow";          // follow the real cursor, or fly to a target
  let follow = null;            // latest cursor point on this display
  let flight = null;            // { from, to, start, duration }

  window.buddy.onCursor((p) => {
    follow = p;
    if (mode === "follow") buddyEl.style.opacity = p ? "1" : "0";
  });

  window.buddy.onPoint(({ rect, caption: text }) => {
    mode = "point";
    const to = { x: rect.x + rect.width / 2 - 4, y: rect.y + rect.height / 2 - 2 };
    flight = { from: { ...pos }, to, start: performance.now(), duration: reduceMotion ? 0 : 650 };
    buddyEl.style.opacity = "1";
    Object.assign(ring.style, { left: rect.x - 6 + "px", top: rect.y - 6 + "px", width: rect.width + 8 + "px", height: rect.height + 8 + "px" });
    ring.classList.add("on");
    caption.textContent = text;
    caption.classList.remove("on");
    setTimeout(() => {
      const right = to.x + 300 < innerWidth;
      caption.style.left = (right ? to.x + 22 : to.x - Math.min(260, caption.offsetWidth) - 10) + "px";
      caption.style.top = Math.min(to.y + 18, innerHeight - 60) + "px";
      caption.classList.add("on");
    }, flight.duration);
  });

  window.buddy.onRelease(() => {
    mode = "follow";
    ring.classList.remove("on");
    caption.classList.remove("on");
    if (!follow) buddyEl.style.opacity = "0";
  });

  const ease = (t) => 1 - Math.pow(1 - t, 3);

  function frame(now) {
    if (mode === "point" && flight) {
      const t = flight.duration ? Math.min(1, (now - flight.start) / flight.duration) : 1;
      const k = ease(t);
      // Arc gently on the way, like something flying rather than sliding.
      const lift = Math.sin(Math.PI * k) * Math.min(80, Math.hypot(flight.to.x - flight.from.x, flight.to.y - flight.from.y) * 0.18);
      pos.x = flight.from.x + (flight.to.x - flight.from.x) * k;
      pos.y = flight.from.y + (flight.to.y - flight.from.y) * k - lift;
    } else if (follow) {
      const tx = follow.x + 16, ty = follow.y + 14;   // sit just beside the real pointer
      pos.x += (tx - pos.x) * 0.25;
      pos.y += (ty - pos.y) * 0.25;
    }
    buddyEl.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
