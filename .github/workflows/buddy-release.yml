name: Buddy release

# Builds Desktop Buddy's Windows installer and uploads it, with latest.yml (the installer's SHA-512, which installed
# copies check every download against), to a DRAFT GitHub release tagged v<version>. Nothing is public until the
# maintainer reviews the draft and publishes it; installed copies only see published releases.
#
# To release: bump "version" in apps/buddy/package.json, commit, then push a matching tag:
#   git tag buddy-v0.2.0 && git push origin buddy-v0.2.0
on:
  push:
    tags: ['buddy-v*']

permissions: {}

jobs:
  release:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release and upload the installer
    defaults:
      run:
        working-directory: apps/buddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "buddy-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match apps/buddy/package.json version $version" >&2
            exit 1
          fi

      # The installer carries the agent-desktop CLI, built from this commit (toolchain from rust-toolchain.toml).
      - name: Build agent-desktop
        working-directory: .
        run: cargo build --release --locked -p agent-desktop

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install scripts: electron-builder fetches its own Electron, and nothing else needs one.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build the installer and upload it to a draft release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
