name: Buddy

# Desktop Buddy (apps/buddy): type check and unit tests on Windows, the only platform Buddy ships on.
on:
  push:
    branches: [main, master]
    paths: ["apps/buddy/**", ".github/workflows/buddy.yml"]
  pull_request:
    paths: ["apps/buddy/**", ".github/workflows/buddy.yml"]
  workflow_dispatch:

concurrency:
  group: buddy-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Type check and tests
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/buddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install scripts: the tests need neither the Electron binary nor the speech runtimes, and skipping them
      # keeps third-party code from running in CI.
      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test
